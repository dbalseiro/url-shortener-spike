ktor:
  deployment:
    port: 8080
  application:
    modules:
      - com.jurisfutura.shortener.MonitoringKt.configureMonitoring
      - com.jurisfutura.shortener.SerializationKt.configureSerialization
      - com.jurisfutura.shortener.StatusPagesKt.configureStatusPages
      - com.jurisfutura.shortener.RoutingKt.configureRouting
      - com.jurisfutura.shortener.redis.RedisPluginKt.configureRedis
rateLimit:
  tokensPerSecond: 5
  maxTokens: 10
  windowSeconds: 60

